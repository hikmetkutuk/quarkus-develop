version: "3.8"

services:

  db:
    image: "postgres:15.5"
    container_name: quarkus-develop-db
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: quarkus_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_quarkus_develop:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:15.5
    container_name: quarkus-develop-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_quarkus_keycloak:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:21.0.2
    container_name: quarkus-develop-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

volumes:
  postgres_data_quarkus_develop: {}
  postgres_data_quarkus_keycloak: